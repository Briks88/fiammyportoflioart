<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Pannello — Fiammetta Codari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Gate PIN -->
  <div class="gate" id="gate" hidden>
    <form class="gate-box" id="gate-form" autocomplete="off">
      <h1 id="gate-title">Area riservata</h1>
      <p id="gate-msg"></p>
      <input type="password" id="pin" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required minlength="4">
      <input type="password" id="pin2" inputmode="numeric" placeholder="Ripeti PIN" hidden>
      <button class="btn solid" type="submit">Entra</button>
      <p class="err" id="gate-err" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <header class="ad-top">
      <div class="wrap ad-top-in">
        <strong class="brand">Pannello opere</strong>
        <div class="ad-actions">
          <a class="link" href="../index.html" target="_blank" rel="noopener">Vedi sito ↗</a>
          <span class="dirty" id="dirty" hidden>Modifiche non pubblicate</span>
          <button class="btn solid" id="publish" disabled>Pubblica</button>
        </div>
      </div>
      <div class="wrap">
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="works" aria-selected="true">Opere</button>
          <button role="tab" data-tab="cats" aria-selected="false">Categorie</button>
          <button role="tab" data-tab="site" aria-selected="false">Sito</button>
          <button role="tab" data-tab="git" aria-selected="false">Collegamento GitHub</button>
        </nav>
      </div>
    </header>

    <main class="wrap ad-main">
      <section id="tab-works"></section>
      <section id="tab-cats" hidden></section>
      <section id="tab-site" hidden></section>
      <section id="tab-git" hidden></section>
    </main>
  </div>

  <dialog id="dlg"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="admin.js"></script>
</body>
</html>
